<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1230" viewBox="0 0 720 1230" role="img" aria-labelledby="title description">
  <title id="title">Separate model, administrator, console and Agent transport credentials</title>
  <desc id="description">The operator supplies the model key privately. An administrator service key authenticates first-Agent helper operations against OCC. OCC stores the model key in a Namespace-owned Secret using the Kubernetes Secret Driver. Both the caller and consuming Agent need operate permission on the exact Secret. The saved harnessAuth contains only a Secret reference. At deployment the model key is projected into the embedded Agent gateway's OPENAI_API_KEY environment variable, and the gateway authenticates HTTPS calls to direct OpenAI. The console password authenticates HTTPS console login. Separate generated gateway and transport credentials authenticate native Agent access, not the model provider. Workload ServiceAccounts cannot read Secrets through the Kubernetes API.</desc>
  <!-- Direct OpenAI helper path; separate gateway-managed Configurations select their own approved provider URL and API. Public source review: openclaw/openclaw-enterprise 8023db20d5a7cfa84dbfe734d43898fc8cc354ce; docs/reference/drivers/kubernetes-secret.md; scripts/first-agent.mjs; docs/guides/deploy/production-agents.md. -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526777"/></marker></defs>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#162a3b}
    .title{font-size:23px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:16px}.note{font-size:14px;fill:#526777}.lane{font-size:15px;font-weight:650;fill:#526777}
    .arrow{fill:none;stroke:#526777;stroke-width:2.4;marker-end:url(#arrow)}.auth{stroke-dasharray:6 5}
  </style>
  <rect width="720" height="1230" rx="12" fill="#ffffff"/>
  <text x="360" y="37" class="title" text-anchor="middle">Separate credentials, separate purposes</text>
  <text x="466" y="70" class="lane" text-anchor="middle">Model authentication path</text>
  <rect x="252" y="89" width="428" height="94" rx="11" fill="#f3edf8" stroke="#ad91bd" stroke-width="1.5"/>
  <text x="466" y="120" class="heading" text-anchor="middle">Operator's approved model key</text>
  <text x="466" y="148" class="body" text-anchor="middle">Private file or secure runtime injection</text>
  <text x="466" y="173" class="note" text-anchor="middle">Never supplied in docs, Git or an agent prompt</text>
  <path class="arrow" d="M 466 183 L 466 230"/>
  <rect x="252" y="234" width="428" height="82" rx="11" fill="#fff6f1" stroke="#cb9b81" stroke-width="1.5"/>
  <text x="466" y="266" class="heading" text-anchor="middle">First-Agent helper calls OCC API</text>
  <text x="466" y="294" class="body" text-anchor="middle">Authenticated Secret and Agent operations</text>
  <rect x="20" y="234" width="198" height="96" rx="10" fill="#eef3fa" stroke="#9ab1c7" stroke-width="1.5"/>
  <text x="119" y="264" class="heading" text-anchor="middle">OCC service key</text>
  <text x="119" y="291" class="body" text-anchor="middle">Administrator API</text>
  <text x="119" y="317" class="note" text-anchor="middle">Generated private file</text>
  <path class="arrow auth" d="M 218 275 L 249 275"/>
  <path class="arrow" d="M 466 316 L 466 365"/>
  <rect x="252" y="369" width="428" height="107" rx="11" fill="#f3edf8" stroke="#ad91bd" stroke-width="1.5"/>
  <text x="466" y="400" class="heading" text-anchor="middle">Namespace-owned OCC Secret</text>
  <text x="466" y="428" class="body" text-anchor="middle">Kubernetes Secret Driver storage</text>
  <text x="466" y="455" class="note" text-anchor="middle">In the owning Namespace's managed control plane</text>
  <path class="arrow" d="M 466 476 L 466 524"/>
  <rect x="252" y="528" width="428" height="101" rx="11" fill="#fff6f1" stroke="#cb9b81" stroke-width="1.5"/>
  <text x="466" y="559" class="heading" text-anchor="middle">Exact Secret IAM checks</text>
  <text x="466" y="586" class="body" text-anchor="middle">Caller + consuming Agent require operate</text>
  <text x="466" y="612" class="note" text-anchor="middle">OCC IAM is separate from Kubernetes RBAC</text>
  <path class="arrow" d="M 466 629 L 466 676"/>
  <rect x="252" y="680" width="428" height="98" rx="11" fill="#f3edf8" stroke="#ad91bd" stroke-width="1.5"/>
  <text x="466" y="711" class="heading" text-anchor="middle">Saved harnessAuth binding</text>
  <text x="466" y="739" class="body" text-anchor="middle">Secret reference, not the raw key value</text>
  <text x="466" y="765" class="note" text-anchor="middle">Deployment freezes and validates the binding</text>
  <path class="arrow" d="M 466 778 L 466 845"/>
  <text x="483" y="815" class="note">Project key at deployment</text>
  <rect x="252" y="849" width="428" height="105" rx="11" fill="#edf7f1" stroke="#86b39a" stroke-width="1.5"/>
  <text x="466" y="880" class="heading" text-anchor="middle">Embedded Agent gateway</text>
  <text x="466" y="908" class="body" text-anchor="middle">OPENAI_API_KEY environment variable</text>
  <text x="466" y="935" class="note" text-anchor="middle">Native configuration resolves its env SecretRef</text>
  <path class="arrow" d="M 466 954 L 466 1030"/>
  <text x="483" y="994" class="note">HTTPS + model key</text>
  <rect x="252" y="1034" width="428" height="94" rx="11" fill="#f3edf8" stroke="#ad91bd" stroke-width="1.5"/>
  <text x="466" y="1067" class="heading" text-anchor="middle">Direct OpenAI provider</text>
  <text x="466" y="1096" class="body" text-anchor="middle">Explicit model · OpenAI Responses protocol</text>
  <text x="119" y="499" class="lane" text-anchor="middle">Separate access paths</text>
  <rect x="20" y="528" width="198" height="89" rx="10" fill="#eef3fa" stroke="#9ab1c7" stroke-width="1.5"/>
  <text x="119" y="559" class="heading" text-anchor="middle">Console password</text>
  <text x="119" y="587" class="body" text-anchor="middle">Generated private file</text>
  <path class="arrow auth" d="M 119 617 L 119 673"/>
  <rect x="20" y="677" width="198" height="89" rx="10" fill="#eef3fa" stroke="#9ab1c7" stroke-width="1.5"/>
  <text x="119" y="710" class="heading" text-anchor="middle">HTTPS console</text>
  <text x="119" y="739" class="body" text-anchor="middle">Human sign-in</text>
  <rect x="20" y="849" width="198" height="110" rx="10" fill="#eef3fa" stroke="#9ab1c7" stroke-width="1.5"/>
  <text x="119" y="879" class="heading" text-anchor="middle">Gateway / transport</text>
  <text x="119" y="905" class="heading" text-anchor="middle">credentials</text>
  <text x="119" y="933" class="note" text-anchor="middle">Native Agent access</text>
  <text x="119" y="951" class="note" text-anchor="middle">Not the model provider key</text>
  <path class="arrow auth" d="M 218 899 L 249 899"/>
  <text x="360" y="1170" class="note" text-anchor="middle">Workload ServiceAccounts cannot read Secrets through the Kubernetes API.</text>
  <text x="360" y="1197" class="note" text-anchor="middle">The diagram shows authentication roles, not the order of resource creation.</text>
</svg>
