<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1336" viewBox="0 0 520 1336" role="img" aria-labelledby="title description">
  <title id="title">Recommended Lima/rootful-Podman path: OpenClaw Enterprise local development architecture</title>
  <desc id="description">An Apple Silicon Mac runs a browser and terminal. This diagram shows the recommended owned Lima Linux virtual machine with rootful Podman path, selected and tested for this onboarding work rather than company-wide runtime policy. Only the OCE work directory is mounted writable. Inspect existing approved environments and preserve the operator's choice. Podman hosts the k3d-managed K3s node containers; the host uses Lima's forwarded Unix socket. Automatic TCP forwarding is limited to OCE loopback ports 3300, 8444 and 6444; other automatic TCP/UDP forwarding is ignored. The recorded repaired-source CSB run passed platform/browser/model and full VM/cluster resume checks. The cluster contains the Envoy Gateway and cert-manager browser entry, the OCE API and worker, PostgreSQL StatefulSet and persistent volume claim, and a tenant Agent Pod running embedded OpenClaw. The Agent calls an approved remote model provider through HTTPS. Sandbox Driver is none, so OpenShell is absent. Dedicated Codex sandbox preflight is a separate startup check, not the starter Agent's execution mode.</desc>
  <!-- Public source review: openclaw/openclaw-enterprise main baseline e5e206c2a9de01601100c06581cc32f73a174456 plus PR 1543 repairs frozen at a6bfbc985943bd79f49def459fdac13f18e06861; Lima 2.2.1 template:podman-rootful; docs/guides/deploy/local-kubernetes-development.md; docs/guides/first-agent.md. -->
